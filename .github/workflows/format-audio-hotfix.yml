name: Format audio hotfix

on:
  push:
    branches: [fix/windows-audio-output]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format sources
        run: |
          clang-format -i src/player_controller.cpp src/player_controller.h
          if git diff --quiet -- src/player_controller.cpp src/player_controller.h; then
            exit 0
          fi
          git config user.name "Samarth Lad"
          git config user.email "142334685+samyyy2311@users.noreply.github.com"
          git add src/player_controller.cpp src/player_controller.h
          git commit -m "Format Windows audio output changes"
          git push origin HEAD:fix/windows-audio-output
