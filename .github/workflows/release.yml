name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]'

  build-windows:
    needs: validate-tag
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: "6.10.3"
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtquickeffectmaker
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCASSETTECAT_PACKAGE_VERSION="$($env:RELEASE_TAG.TrimStart('v'))"
      - name: Build
        run: cmake --build build/release --parallel 2
      - name: Run self-check and tests
        shell: pwsh
        run: |
          .\build\release\CassetteCat.exe --self-check
          ctest --test-dir build/release --output-on-failure
      - name: Package Windows artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          $prefix = Join-Path $PWD 'dist\CassetteCat'
          cmake --install build/release --component runtime --prefix $prefix
          Compress-Archive -Path $prefix -DestinationPath "CassetteCat-$env:RELEASE_TAG-windows-x64.zip"
          Expand-Archive -Force "CassetteCat-$env:RELEASE_TAG-windows-x64.zip" -DestinationPath smoke
          if (-not (Test-Path smoke\CassetteCat\bin\CassetteCat.exe)) { throw 'Portable ZIP is missing CassetteCat.exe.' }
          .\smoke\CassetteCat\bin\CassetteCat.exe --self-check
          choco install innosetup --version=6.7.1 --no-progress --limit-output -y
          $version = $env:RELEASE_TAG.TrimStart('v')
          iscc.exe "/DAppVersion=$version" installer\CassetteCat.iss
          $installer = Get-ChildItem dist -Filter 'CassetteCat-*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Inno Setup did not produce an installer.' }
          Move-Item $installer.FullName "CassetteCat-$env:RELEASE_TAG-windows-x64-setup.exe"
          if ((Get-Item "CassetteCat-$env:RELEASE_TAG-windows-x64.zip").Length -le 0) { throw 'Portable ZIP is empty.' }
          if ((Get-Item "CassetteCat-$env:RELEASE_TAG-windows-x64-setup.exe").Length -le 0) { throw 'Installer is empty.' }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            CassetteCat-${{ env.RELEASE_TAG }}-windows-x64.zip
            CassetteCat-${{ env.RELEASE_TAG }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
      # Unsigned: the Microsoft Store signs it on submission. Set the MSIX_* repository variables
      # from Partner Center > Product identity to produce it.
      - name: Package for the Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          .\packaging\msix\build-msix.ps1 -InstallDir dist\CassetteCat -Version $env:RELEASE_TAG.TrimStart('v') `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -Output "CassetteCat-$env:RELEASE_TAG-store.msix"
      - name: Upload Store package
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-store
          path: CassetteCat-${{ env.RELEASE_TAG }}-store.msix
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: validate-tag
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            qt-host: linux
            qt-arch: linux_gcc_64
            arch: x86_64
            deb-arch: amd64
            tar-arch: x64
          - runner: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            arch: aarch64
            deb-arch: arm64
            tar-arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_OFFSCREEN_NO_GLX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: "6.10.3"
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          modules: qtmultimedia qtquickeffectmaker
          cache: true
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libpipewire-0.3-0 libsecret-1-dev rpm
          curl -fsSL -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-${{ matrix.arch }}.AppImage
          chmod +x linuxdeploy.AppImage
      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCASSETTECAT_PACKAGE_VERSION="${RELEASE_TAG#v}"
      - name: Build
        run: cmake --build build/release --parallel 2
      - name: Run self-check and tests
        run: |
          ./build/release/bin/CassetteCat --self-check
          ctest --test-dir build/release --output-on-failure
      - name: Package Linux artifacts
        run: |
          prefix="$PWD/dist/CassetteCat"
          mkdir -p "$prefix"
          cmake --install build/release --component runtime --prefix "$prefix"
          tar -czf "CassetteCat-${RELEASE_TAG}-linux-${{ matrix.tar-arch }}.tar.gz" -C dist CassetteCat
          mkdir -p smoke && tar -xzf "CassetteCat-${RELEASE_TAG}-linux-${{ matrix.tar-arch }}.tar.gz" -C smoke
          smoke/CassetteCat/bin/CassetteCat --self-check
          cpack --config build/release/CPackConfig.cmake -G DEB
          cpack --config build/release/CPackConfig.cmake -G RPM
          deb=$(find . -maxdepth 1 -name '*.deb' -print -quit)
          rpm=$(find . -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$deb" && mv "$deb" "CassetteCat-${RELEASE_TAG}-linux-${{ matrix.deb-arch }}.deb"
          test -n "$rpm" && mv "$rpm" "CassetteCat-${RELEASE_TAG}-linux-${{ matrix.arch }}.rpm"
          export APPIMAGE_EXTRACT_AND_RUN=1
          cp assets/cassettecat_icon.png io.github.samyyy2311.CassetteCat.png
          ./linuxdeploy.AppImage --appdir AppDir --executable dist/CassetteCat/bin/CassetteCat --desktop-file packaging/linux/io.github.samyyy2311.CassetteCat.desktop --icon-file io.github.samyyy2311.CassetteCat.png --output appimage
          mv CassetteCat*.AppImage "CassetteCat-${RELEASE_TAG}-linux-${{ matrix.arch }}.AppImage"
          chmod +x "CassetteCat-${RELEASE_TAG}-linux-${{ matrix.arch }}.AppImage"
          "./CassetteCat-${RELEASE_TAG}-linux-${{ matrix.arch }}.AppImage" --self-check
      - name: Build Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --disable-rofiles-fuse --user --install-deps-from=flathub --default-branch="${RELEASE_TAG#v}" --repo=flatpak-repo build/flatpak packaging/flatpak/io.github.samyyy2311.CassetteCat.yml
          flatpak build-bundle flatpak-repo "CassetteCat-${RELEASE_TAG}-${{ matrix.arch }}.flatpak" io.github.samyyy2311.CassetteCat "${RELEASE_TAG#v}"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            CassetteCat-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.AppImage
            CassetteCat-${{ env.RELEASE_TAG }}-linux-${{ matrix.tar-arch }}.tar.gz
            CassetteCat-${{ env.RELEASE_TAG }}-linux-${{ matrix.deb-arch }}.deb
            CassetteCat-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.rpm
            CassetteCat-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: validate-tag
    runs-on: macos-15
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Ninja
        run: command -v ninja || brew install ninja
      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: "6.10.3"
          target: desktop
          arch: clang_64
          modules: qtmultimedia qtquickeffectmaker
          cache: true
      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCASSETTECAT_PACKAGE_VERSION="${RELEASE_TAG#v}"
      - name: Build
        run: cmake --build build/release --parallel 3
      - name: Run self-check and tests
        run: |
          ./build/release/CassetteCat.app/Contents/MacOS/CassetteCat --self-check
          ctest --test-dir build/release --output-on-failure
      - name: Package macOS disk image
        run: |
          cmake --install build/release --component runtime --prefix dist
          # Unsigned: an ad-hoc signature lets it run on Apple silicon, and people open it once with right-click > Open.
          codesign --force --deep --sign - dist/CassetteCat.app
          lipo -verify_arch arm64 x86_64 dist/CassetteCat.app/Contents/MacOS/CassetteCat
          dist/CassetteCat.app/Contents/MacOS/CassetteCat --self-check
          ln -s /Applications dist/Applications
          hdiutil create -volname CassetteCat -srcfolder dist -ov -format UDZO "CassetteCat-${RELEASE_TAG}-macos-universal.dmg"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: CassetteCat-${{ env.RELEASE_TAG }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 7

  verify-release:
    needs: [validate-tag, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Install package validators
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Validate tag and release assets
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "Malformed release tag: $TAG"; exit 1; }
          expected=(
            "CassetteCat-${TAG}-windows-x64.zip"
            "CassetteCat-${TAG}-windows-x64-setup.exe"
            "CassetteCat-${TAG}-macos-universal.dmg"
          )
          for arch in x86_64 aarch64; do
            deb_arch=$([[ $arch == x86_64 ]] && echo amd64 || echo arm64)
            tar_arch=$([[ $arch == x86_64 ]] && echo x64 || echo arm64)
            expected+=(
              "CassetteCat-${TAG}-linux-${arch}.AppImage"
              "CassetteCat-${TAG}-linux-${tar_arch}.tar.gz"
              "CassetteCat-${TAG}-linux-${deb_arch}.deb"
              "CassetteCat-${TAG}-linux-${arch}.rpm"
              "CassetteCat-${TAG}-${arch}.flatpak"
            )
          done
          for file in "${expected[@]}"; do test -s "release-assets/$file" || { echo "Missing release asset: $file"; exit 1; }; done
          for deb in release-assets/*.deb; do dpkg-deb --info "$deb" >/dev/null; done
          for rpm in release-assets/*.rpm; do rpm -qip "$rpm" >/dev/null && rpm -qlp "$rpm" >/dev/null; done
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/CassetteCat-${{ env.RELEASE_TAG }}.spdx.json
          upload-release-assets: false
      - name: Generate and verify checksums
        run: |
          rm -f release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verified
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified
          path: release-assets
      - name: Attest verified release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=("$TAG" release-assets/* --title "CassetteCat $TAG" --generate-notes)
            [[ "$TAG" == *-* ]] && args+=(--prerelease)
            gh release create "${args[@]}"
          fi

  publish-winget:
    needs: publish-release
    runs-on: windows-latest
    environment: release
    permissions: {}
    steps:
      - name: Check WinGet eligibility
        id: check-eligibility
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if ($env:TAG -match '-') {
            Write-Host "Tag $env:TAG is a pre-release. Skipping WinGet package update."
            "eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Host "::warning::WINGET_TOKEN secret is not configured. Skipping WinGet package update."
            "eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "eligible=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install wingetcreate
        if: steps.check-eligibility.outputs.eligible == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"

      - name: Submit package to WinGet
        if: steps.check-eligibility.outputs.eligible == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/CassetteCat-$env:TAG-windows-x64-setup.exe"
          .\wingetcreate.exe update CassetteCat.CassetteCat `
            --version $version `
            --urls $url `
            --token $env:WINGET_TOKEN `
            --submit
