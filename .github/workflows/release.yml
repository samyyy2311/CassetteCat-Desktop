name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check release tag
        shell: pwsh
        run: if ($env:RELEASE_TAG -notmatch '^v.+') { throw 'Release tags must start with v.' }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.*"
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/release --parallel

      - name: Run self-check
        run: .\build\release\CassetteCat.exe --self-check

      - name: Package
        shell: pwsh
        run: |
          cmake --install build/release --prefix dist/CassetteCat
          Compress-Archive -Path dist/CassetteCat -DestinationPath "CassetteCat-$env:RELEASE_TAG-windows-x64.zip"
          (Get-FileHash "CassetteCat-$env:RELEASE_TAG-windows-x64.zip" -Algorithm SHA256).Hash | Set-Content "CassetteCat-$env:RELEASE_TAG-windows-x64.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" "CassetteCat-$env:RELEASE_TAG-windows-x64.zip" "CassetteCat-$env:RELEASE_TAG-windows-x64.zip.sha256" --generate-notes --title "CassetteCat $env:RELEASE_TAG"

  linux:
    needs: windows
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_OFFSCREEN_NO_GLX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.*"
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/release --parallel 2

      - name: Run self-check
        run: ./build/release/CassetteCat --self-check

      - name: Run tests
        run: ctest --test-dir build/release --output-on-failure

      - name: Package
        run: |
          cmake --install build/release --prefix dist/CassetteCat
          tar -czf "CassetteCat-$RELEASE_TAG-linux-x64.tar.gz" -C dist CassetteCat
          sha256sum "CassetteCat-$RELEASE_TAG-linux-x64.tar.gz" > "CassetteCat-$RELEASE_TAG-linux-x64.tar.gz.sha256"

      - name: Publish Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "CassetteCat-$RELEASE_TAG-linux-x64.tar.gz" "CassetteCat-$RELEASE_TAG-linux-x64.tar.gz.sha256"
