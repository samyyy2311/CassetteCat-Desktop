app-id: io.github.samyyy2311.CassetteCat
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: CassetteCat
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host:ro
modules:
  - name: cassettecat
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCASSETTECAT_BUILD_TESTING=OFF
      - -DCASSETTECAT_TAGLIB_SOURCE_DIR=/run/build/cassettecat/taglib
    sources:
      - type: dir
        path: ../..
      - type: git
        url: https://github.com/taglib/taglib.git
        tag: v2.0.2
        dest: taglib
