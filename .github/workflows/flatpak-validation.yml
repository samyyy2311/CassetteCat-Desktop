name: Flatpak validation

on:
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/linux/**'
      - 'assets/cassettecat_icon.png'
      - '.github/workflows/release.yml'
      - '.github/workflows/flatpak-validation.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/linux/**'
      - 'assets/cassettecat_icon.png'
      - '.github/workflows/release.yml'
      - '.github/workflows/flatpak-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils flatpak flatpak-builder
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/io.github.samyyy2311.CassetteCat.desktop
          appstreamcli validate --no-net packaging/linux/io.github.samyyy2311.CassetteCat.metainfo.xml
      - name: Build Flatpak bundle
        env:
          FLATPAK_BRANCH: ci
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --disable-rofiles-fuse --user --install-deps-from=flathub --default-branch="$FLATPAK_BRANCH" --repo=flatpak-repo build/flatpak packaging/flatpak/io.github.samyyy2311.CassetteCat.yml
          flatpak build-bundle flatpak-repo CassetteCat-flatpak-validation-x86_64.flatpak io.github.samyyy2311.CassetteCat "$FLATPAK_BRANCH"
          test -s CassetteCat-flatpak-validation-x86_64.flatpak
      - name: Upload validation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-validation-${{ github.run_id }}
          path: CassetteCat-flatpak-validation-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7
