name: Format credential storage

on:
  push:
    branches: [harden/linux-credential-storage]
    paths:
      - 'src/credential_vault.cpp'
      - 'src/credential_vault.h'
      - 'src/services_scrobble.cpp'
      - '.github/workflows/format-credential-storage.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: harden/linux-credential-storage
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format changed sources
        run: clang-format -i src/credential_vault.cpp src/credential_vault.h src/services_scrobble.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name samyyy2311
          git config user.email samyyy2311@users.noreply.github.com
          git add src/credential_vault.cpp src/credential_vault.h src/services_scrobble.cpp
          git commit -m "Format credential storage changes"
          git push origin HEAD:harden/linux-credential-storage
