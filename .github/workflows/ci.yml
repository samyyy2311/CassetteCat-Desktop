name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.*"
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtquickeffectmaker
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Run self-check
        run: .\build\ci\CassetteCat.exe --self-check

      - name: Run tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Package portable app
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD 'dist\CassetteCat'
          cmake --install build/ci --component runtime --prefix $prefix
          Compress-Archive -Path $prefix -DestinationPath "CassetteCat-ci-${{ github.sha }}-windows-x64.zip"

      - name: Check installer audio formats
        shell: pwsh
        run: |
          $scanner = Get-Content 'src\library_scanner.cpp' -Raw
          $installer = Get-Content 'installer\CassetteCat.iss' -Raw
          $scannerFormats = @([regex]::Matches($scanner, '"\*\.(?<ext>[A-Za-z0-9]+)"') | ForEach-Object { $_.Groups['ext'].Value.ToLowerInvariant() } | Sort-Object -Unique)
          $installerFormats = @([regex]::Matches($installer, 'Software\\Classes\\\.(?<ext>[A-Za-z0-9]+)\\OpenWithProgids') | ForEach-Object { $_.Groups['ext'].Value.ToLowerInvariant() } | Sort-Object -Unique)
          if ($scannerFormats.Count -eq 0 -or $installerFormats.Count -eq 0) { throw 'Could not detect scanner or installer audio formats.' }
          $difference = Compare-Object -ReferenceObject $scannerFormats -DifferenceObject $installerFormats
          if ($difference) {
            Write-Host "Scanner formats: $($scannerFormats -join ', ')"
            Write-Host "Installer formats: $($installerFormats -join ', ')"
            $difference | Format-Table | Out-String | Write-Host
            throw 'Installer Open with formats do not match the library scanner.'
          }

      - name: Validate Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --limit-output -y
          iscc.exe "/DAppVersion=0.0.0-ci" installer\CassetteCat.iss
          $installer = 'dist\CassetteCat-0.0.0-ci-windows-x64-setup.exe'
          if (-not (Test-Path $installer)) { throw 'Inno Setup did not produce the installer.' }
          if ((Get-Item $installer).Length -le 0) { throw 'Installer is empty.' }

      - name: Upload portable app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CassetteCat-windows-ci-${{ github.sha }}
          path: CassetteCat-ci-${{ github.sha }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_OFFSCREEN_NO_GLX: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libpipewire-0.3-0 libsecret-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.*"
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtquickeffectmaker
          cache: true

      - name: Build credential vault probe
        run: |
          cmake -S tests/credential_vault -B build/vault-probe -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/vault-probe --parallel 2

      - name: Verify unavailable Secret Service handling
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/cassettecat-missing-secret-service
        run: ./build/vault-probe/credential_vault_probe --expect-unavailable

      - name: Verify Secret Service credential lifecycle
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/tmp/cassettecat-keyring-env
            ./build/vault-probe/credential_vault_probe
          '

      - name: Configure
        run: cmake -S . -B build/ci-linux -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/ci-linux --parallel 2

      - name: Run self-check
        run: ./build/ci-linux/bin/CassetteCat --self-check

      - name: Run tests
        run: ctest --test-dir build/ci-linux --output-on-failure
