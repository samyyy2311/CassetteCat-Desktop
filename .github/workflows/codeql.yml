name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_OFFSCREEN_NO_GLX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libssl-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.11.2"
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtquickeffectmaker
          cache: true

      - name: Configure
        run: cmake -S . -B build/codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      # TagLib is third-party code; building it before CodeQL starts keeps it out of the analysis.
      - name: Build TagLib
        run: cmake --build build/codeql --target tag --parallel 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: cpp
          build-mode: manual

      - name: Build
        run: cmake --build build/codeql --parallel 2

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
