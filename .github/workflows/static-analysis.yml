name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_OFFSCREEN_NO_GLX: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang-format
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.*"
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtquickeffectmaker
          cache: true
      - name: Configure
        run: cmake -S . -B build/analysis -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build/analysis --parallel 2
      - name: Run clang-tidy
        run: |
          mapfile -t files < <(git ls-files 'src/*.cpp')
          if ((${#files[@]})); then
            clang-tidy -p build/analysis --config-file=.clang-tidy "${files[@]}"
          fi
      - name: Verify changed C++ formatting
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git rev-parse --verify "$base" >/dev/null 2>&1; then
            mapfile -t files < <(git diff --diff-filter=ACMRT --name-only "$base" "$GITHUB_SHA" -- '*.cpp' '*.h')
            if ((${#files[@]})); then
              clang-format -i "${files[@]}"
              git diff --exit-code -- "${files[@]}"
            fi
          fi
